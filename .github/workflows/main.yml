name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar
        run: cmake -S . -B build -A Win32
      - name: Compilar
        run: cmake --build build --config Release
      - name: Montar pacote
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item build/out/RE5Trainer.exe dist/
          Copy-Item build/out/RE5Overlay.dll dist/
          Copy-Item offsets.ini dist/
          Copy-Item LEIA-ME.txt dist/
      - uses: actions/upload-artifact@v4
        with:
          name: RE5Trainer
          path: dist
