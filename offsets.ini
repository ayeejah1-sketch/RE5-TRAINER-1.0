; ===========================================================================
;  offsets.ini - enderecos do Resident Evil 5 (re5dx9.exe)
;  Cada funcao do trainer so liga depois de ter uma secao aqui.
;  Sem secao = aparece como "(nao calibrado)" e fica bloqueada. Nada e chutado.
; ===========================================================================

[meta]
; identifica o executavel exato (re5dx9.exe 1.0.6). Se for outro, tudo bloqueia.
timestamp=0x589718AB

; ---------------------------------------------------------------------------
;  Modelos (exemplos comentados):
;
;  [god]                       ; patch de bytes (verifica os bytes originais!)
;  type=bytes
;  addr=0x00ABCDEF
;  orig=89 45 10
;  patch=90 90 90
;
;  [money]                     ; valor congelado todo frame
;  type=value
;  addr=0x00DA0000             ; endereco do ponteiro base (ou do valor)
;  chain=0x10,0x4C             ; opcional: offsets da cadeia de ponteiros
;  vtype=i32                   ; u8 i16 i32 f32 rgb_u8 rgb_f32
;  value=99999999
;
;  [speed]                     ; sem 'value' = usa o slider do menu
;  type=value
;  addr=0x...
;  vtype=f32
;
;  [laser_color]
;  type=value
;  addr=0x...
;  vtype=rgb_f32               ; usa a cor escolhida no seletor
;
;  [char_p1]                   ; combo: 'values' = valor gravado para cada nome
;  type=value
;  addr=0x...
;  vtype=i32
;  values=0,1,2,3,4,5,6,7
;
;  Varios alvos na mesma funcao: [god], [god.2], [god.3] ...
; ---------------------------------------------------------------------------
